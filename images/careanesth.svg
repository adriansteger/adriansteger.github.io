<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <!-- Abstract illustration: message queue -> dispatcher with retry loop -> delivered messages -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="400" rx="18" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 80H640M0 160H640M0 240H640M0 320H640M80 0V400M160 0V400M240 0V400M320 0V400M400 0V400M480 0V400M560 0V400"/>
  </g>

  <!-- Queue -->
  <rect x="40" y="110" width="150" height="180" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
  <g>
    <rect x="58" y="128" width="114" height="28" rx="7" fill="#1e293b" stroke="#6366f1" stroke-opacity="0.5"/>
    <rect x="70" y="139" width="14" height="6" rx="3" fill="#6366f1"/>
    <rect x="92" y="139" width="60" height="6" rx="3" fill="#cbd5e1" fill-opacity="0.5"/>
    <rect x="58" y="166" width="114" height="28" rx="7" fill="#1e293b" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="70" y="177" width="14" height="6" rx="3" fill="#64748b"/>
    <rect x="92" y="177" width="48" height="6" rx="3" fill="#cbd5e1" fill-opacity="0.35"/>
    <rect x="58" y="204" width="114" height="28" rx="7" fill="#1e293b" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="70" y="215" width="14" height="6" rx="3" fill="#64748b"/>
    <rect x="92" y="215" width="66" height="6" rx="3" fill="#cbd5e1" fill-opacity="0.35"/>
    <rect x="58" y="242" width="114" height="28" rx="7" fill="#1e293b" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="70" y="253" width="14" height="6" rx="3" fill="#64748b"/>
    <rect x="92" y="253" width="40" height="6" rx="3" fill="#cbd5e1" fill-opacity="0.35"/>
  </g>

  <!-- Queue -> dispatcher -->
  <path d="M190 200 H 262" stroke="url(#brand)" stroke-width="3" stroke-linecap="round"/>
  <path d="M254 192 l10 8 l-10 8" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Dispatcher (function node) -->
  <circle cx="320" cy="200" r="90" fill="url(#glow)"/>
  <rect x="272" y="152" width="96" height="96" rx="22" fill="#1e293b" stroke="url(#brand)" stroke-width="2.5"/>
  <path d="M306 182 l-14 18 l14 18 M334 182 l14 18 l-14 18" fill="none" stroke="#a5b4fc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Retry loop -->
  <path d="M300 152 C 290 96, 350 96, 340 152" fill="none" stroke="#f59e0b" stroke-opacity="0.85" stroke-width="2.5" stroke-dasharray="5 6" stroke-linecap="round"/>
  <path d="M334 144 l6 9 l7 -9" fill="none" stroke="#f59e0b" stroke-opacity="0.85" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Fan-out to delivered messages -->
  <g fill="none" stroke="url(#brand)" stroke-width="2" stroke-linecap="round">
    <path d="M368 200 C 410 200, 420 122, 460 122"/>
    <path d="M368 200 H 460"/>
    <path d="M368 200 C 410 200, 420 278, 460 278"/>
  </g>

  <!-- Delivered message bubbles -->
  <g>
    <rect x="460" y="100" width="140" height="44" rx="12" fill="#1e293b" stroke="#10b981" stroke-opacity="0.6"/>
    <rect x="476" y="117" width="70" height="6" rx="3" fill="#cbd5e1" fill-opacity="0.5"/>
    <path d="M568 122 l6 6 l12 -12" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="460" y="178" width="140" height="44" rx="12" fill="#1e293b" stroke="#10b981" stroke-opacity="0.6"/>
    <rect x="476" y="195" width="58" height="6" rx="3" fill="#cbd5e1" fill-opacity="0.5"/>
    <path d="M568 200 l6 6 l12 -12" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="460" y="256" width="140" height="44" rx="12" fill="#1e293b" stroke="#10b981" stroke-opacity="0.6"/>
    <rect x="476" y="273" width="76" height="6" rx="3" fill="#cbd5e1" fill-opacity="0.5"/>
    <path d="M568 278 l6 6 l12 -12" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Cost trend -->
  <g transform="translate(272 300)">
    <rect width="96" height="52" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
    <path d="M12 16 L36 22 L56 30 L84 40" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M76 40 h8 v-8" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
