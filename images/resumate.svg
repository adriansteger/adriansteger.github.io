<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <!-- Abstract illustration: talent pipeline (kanban columns) feeding a matching engine -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="400" rx="18" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 80H640M0 160H640M0 240H640M0 320H640M80 0V400M160 0V400M240 0V400M320 0V400M400 0V400M480 0V400M560 0V400"/>
  </g>

  <!-- Kanban columns -->
  <g fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08">
    <rect x="40" y="56" width="104" height="288" rx="12"/>
    <rect x="160" y="56" width="104" height="288" rx="12"/>
    <rect x="280" y="56" width="104" height="288" rx="12"/>
  </g>
  <g fill="#94a3b8" fill-opacity="0.35">
    <rect x="56" y="72" width="44" height="6" rx="3"/>
    <rect x="176" y="72" width="52" height="6" rx="3"/>
    <rect x="296" y="72" width="36" height="6" rx="3"/>
  </g>

  <!-- Cards -->
  <g>
    <rect x="52" y="94" width="80" height="54" rx="8" fill="#1e293b" stroke="#6366f1" stroke-opacity="0.5"/>
    <circle cx="68" cy="112" r="7" fill="#6366f1"/>
    <rect x="80" y="108" width="40" height="5" rx="2.5" fill="#cbd5e1" fill-opacity="0.6"/>
    <rect x="62" y="128" width="30" height="8" rx="4" fill="#6366f1" fill-opacity="0.35"/>

    <rect x="52" y="158" width="80" height="54" rx="8" fill="#1e293b" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="68" cy="176" r="7" fill="#64748b"/>
    <rect x="80" y="172" width="34" height="5" rx="2.5" fill="#cbd5e1" fill-opacity="0.45"/>
    <rect x="62" y="192" width="40" height="8" rx="4" fill="#94a3b8" fill-opacity="0.25"/>

    <rect x="52" y="222" width="80" height="54" rx="8" fill="#1e293b" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="68" cy="240" r="7" fill="#64748b"/>
    <rect x="80" y="236" width="44" height="5" rx="2.5" fill="#cbd5e1" fill-opacity="0.45"/>
    <rect x="62" y="256" width="26" height="8" rx="4" fill="#94a3b8" fill-opacity="0.25"/>

    <rect x="172" y="94" width="80" height="54" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-opacity="0.5"/>
    <circle cx="188" cy="112" r="7" fill="#06b6d4"/>
    <rect x="200" y="108" width="38" height="5" rx="2.5" fill="#cbd5e1" fill-opacity="0.6"/>
    <rect x="182" y="128" width="36" height="8" rx="4" fill="#06b6d4" fill-opacity="0.35"/>

    <rect x="172" y="158" width="80" height="54" rx="8" fill="#1e293b" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="188" cy="176" r="7" fill="#64748b"/>
    <rect x="200" y="172" width="30" height="5" rx="2.5" fill="#cbd5e1" fill-opacity="0.45"/>
    <rect x="182" y="192" width="44" height="8" rx="4" fill="#94a3b8" fill-opacity="0.25"/>

    <rect x="292" y="94" width="80" height="54" rx="8" fill="#1e293b" stroke="#10b981" stroke-opacity="0.6"/>
    <circle cx="308" cy="112" r="7" fill="#10b981"/>
    <rect x="320" y="108" width="40" height="5" rx="2.5" fill="#cbd5e1" fill-opacity="0.6"/>
    <rect x="302" y="128" width="34" height="8" rx="4" fill="#10b981" fill-opacity="0.35"/>
  </g>

  <!-- Flow into matching engine -->
  <g fill="none" stroke="url(#brand)" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 7">
    <path d="M384 121 C 430 121, 440 200, 480 200"/>
    <path d="M384 200 C 430 200, 440 200, 480 200"/>
    <path d="M384 280 C 430 280, 440 200, 480 200"/>
  </g>

  <!-- Matching engine -->
  <circle cx="530" cy="200" r="96" fill="url(#glow)"/>
  <circle cx="530" cy="200" r="58" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="10"/>
  <circle cx="530" cy="200" r="58" fill="none" stroke="url(#brand)" stroke-width="10" stroke-linecap="round" stroke-dasharray="290 365" transform="rotate(-90 530 200)"/>
  <circle cx="530" cy="200" r="34" fill="#1e293b" stroke="#ffffff" stroke-opacity="0.1"/>
  <path d="M516 200 l9 9 l18 -19" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
